<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Programas{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
        header { background: #2c3e50; color: white; padding: 1rem 2rem; }
        main { max-width: 600px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 8px; }
        label { display: block; margin-top: 1rem; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .mensaje { background: #d4edda; color: #155724; padding: 0.75rem; border-radius: 4px; }
        .error { color: #c0392b; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <h1>Programas universitarios</h1>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
